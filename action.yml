name: Dailyshot Issue Automation
description: Run Dailyshot issue automation, Claude Code, dependency issue creation, and PR finalization.

inputs:
  github_token:
    description: GitHub token used for checkout, issue, pull request, and repository API calls.
    required: true
  dependency_issue_token:
    description: GitHub token used for dependency repository issue creation. Falls back to github_token when omitted.
    required: false
  claude_code_oauth_token:
    description: Claude Code Action OAuth token.
    required: false
  issue_number:
    description: Issue number used for workflow_dispatch. Issue events can omit this.
    required: false
  force_ai:
    description: Re-run the Claude runner when the issue automation state allows manual retry.
    required: false
    default: "false"
  config_path:
    description: Repository-local issue automation config path.
    required: false
    default: .github/issue-automation.yml
  agent_contract_path:
    description: Repository-local Claude agent contract path.
    required: false
    default: .github/ai/issue-agent-contract.md

outputs:
  should_run:
    description: Whether the Claude runner executed.
    value: ${{ steps.prepare.outputs.should_run }}
  issue_number:
    description: Loaded issue number.
    value: ${{ steps.prepare.outputs.issue_number }}
  branch:
    description: Branch name for the Claude runner.
    value: ${{ steps.prepare.outputs.branch }}
  issue_context_path:
    description: Generated issue context Markdown path.
    value: ${{ steps.prepare.outputs.issue_context_path }}
  runner_result_path:
    description: Runner result JSON path.
    value: ${{ steps.prepare.outputs.runner_result_path }}
  pr_url:
    description: Created pull request URL.
    value: ${{ steps.pr.outputs.url }}

runs:
  using: composite
  steps:
    - name: Checkout caller repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ inputs.github_token }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Classify and route issue
      shell: bash
      env:
        INPUT_PHASE: intake
        INPUT_GITHUB_TOKEN: ${{ inputs.dependency_issue_token || inputs.github_token }}
        INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        INPUT_FORCE_AI: ${{ inputs.force_ai }}
        INPUT_CONFIG_PATH: ${{ inputs.config_path }}
        INPUT_AGENT_CONTRACT_PATH: ${{ inputs.agent_contract_path }}
      run: node "$GITHUB_ACTION_PATH/dist/index.js"

    - name: Prepare Claude runner
      id: prepare
      if: >-
        ${{
          github.event_name == 'workflow_dispatch'
          || (
            github.event_name == 'issues'
            && !github.event.issue.pull_request
            && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
          )
        }}
      shell: bash
      env:
        INPUT_PHASE: prepare
        INPUT_GITHUB_TOKEN: ${{ inputs.dependency_issue_token || inputs.github_token }}
        INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        INPUT_FORCE_AI: ${{ inputs.force_ai }}
        INPUT_CONFIG_PATH: ${{ inputs.config_path }}
        INPUT_AGENT_CONTRACT_PATH: ${{ inputs.agent_contract_path }}
      run: node "$GITHUB_ACTION_PATH/dist/index.js"

    - name: Configure git
      if: ${{ steps.prepare.outputs.should_run == 'true' }}
      shell: bash
      run: |
        git config user.name "dailyshot-claude-runner"
        git config user.email "dailyshot-claude-runner@users.noreply.github.com"

    - name: Create branch
      if: ${{ steps.prepare.outputs.should_run == 'true' }}
      shell: bash
      run: git checkout -b "${{ steps.prepare.outputs.branch }}"

    - name: Run Claude Code
      id: ai
      if: ${{ steps.prepare.outputs.should_run == 'true' && inputs.claude_code_oauth_token != '' }}
      continue-on-error: true
      uses: anthropics/claude-code-action@v1
      env:
        ISSUE_CONTEXT_PATH: ${{ steps.prepare.outputs.issue_context_path }}
        RUNNER_RESULT_PATH: ${{ steps.prepare.outputs.runner_result_path }}
        GH_TOKEN: ${{ inputs.github_token }}
      with:
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        github_token: ${{ inputs.github_token }}
        prompt: |
          REPO: ${{ github.repository }}
          ISSUE NUMBER: ${{ steps.prepare.outputs.issue_number }}
          ISSUE CONTEXT PATH: ${{ steps.prepare.outputs.issue_context_path }}
          RUNNER RESULT PATH: ${{ steps.prepare.outputs.runner_result_path }}
          AGENT CONTRACT PATH: ${{ inputs.agent_contract_path }}

          당신은 repository issue 처리 agent입니다.
          모든 응답과 작성하는 issue/PR 설명은 한국어로 작성하세요.

          1. ISSUE_CONTEXT_PATH와 AGENT CONTRACT PATH를 읽고 issue title/body/automation state를 확인합니다.
          2. repository 변경만으로 해결 가능하고 범위가 명확하면 repository 파일을 직접 수정합니다.
          3. workflow가 commit, push, PR 생성을 처리하므로 직접 수행하지 않습니다.
          4. 테스트, self-test, lint, package install은 실행하지 않습니다.
          5. repository 파일을 수정했다면 RUNNER_RESULT_PATH에 create_pr JSON을 작성합니다.
          6. dependency repository 작업이 필요하면 RUNNER_RESULT_PATH의 needsIssues 배열에 config dependencies key를 작성합니다.
          7. 정보가 부족하거나 사람의 판단이 필요하면 needs_info 또는 needs_maintainer 결과 JSON을 작성합니다.
        claude_args: |
          --allowedTools "Read,Edit,MultiEdit,Write,Glob,Grep,LS,Bash(git status:*),Bash(git diff:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*)"

    - name: Finalize missing Claude token
      if: ${{ steps.prepare.outputs.should_run == 'true' && inputs.claude_code_oauth_token == '' }}
      shell: bash
      env:
        INPUT_PHASE: finalize_claude_action_failure
        INPUT_GITHUB_TOKEN: ${{ inputs.dependency_issue_token || inputs.github_token }}
        INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        INPUT_FORCE_AI: ${{ inputs.force_ai }}
        INPUT_CONFIG_PATH: ${{ inputs.config_path }}
        INPUT_AGENT_CONTRACT_PATH: ${{ inputs.agent_contract_path }}
        INPUT_FAILURE_REASON: Repository secret CLAUDE_CODE_OAUTH_TOKEN is not configured.
      run: node "$GITHUB_ACTION_PATH/dist/index.js"

    - name: Detect repository changes
      id: changes
      if: ${{ steps.prepare.outputs.should_run == 'true' && inputs.claude_code_oauth_token != '' }}
      continue-on-error: true
      shell: bash
      env:
        ISSUE_CONTEXT_PATH: ${{ steps.prepare.outputs.issue_context_path }}
        RUNNER_RESULT_PATH: ${{ steps.prepare.outputs.runner_result_path }}
      run: |
        if [ -n "$(git status --porcelain -- . ":(exclude)$ISSUE_CONTEXT_PATH" ":(exclude)$RUNNER_RESULT_PATH")" ]; then
          printf 'has_changes=true\n' >>"$GITHUB_OUTPUT"
        else
          printf 'has_changes=false\n' >>"$GITHUB_OUTPUT"
        fi

    - name: Prepare pull request metadata
      id: pr_metadata
      if: ${{ steps.prepare.outputs.should_run == 'true' && inputs.claude_code_oauth_token != '' && steps.ai.outcome == 'success' && steps.changes.outputs.has_changes == 'true' }}
      continue-on-error: true
      shell: bash
      env:
        INPUT_PHASE: prepare_pr_metadata
        INPUT_GITHUB_TOKEN: ${{ inputs.dependency_issue_token || inputs.github_token }}
        INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        INPUT_FORCE_AI: ${{ inputs.force_ai }}
        INPUT_CONFIG_PATH: ${{ inputs.config_path }}
        INPUT_AGENT_CONTRACT_PATH: ${{ inputs.agent_contract_path }}
      run: node "$GITHUB_ACTION_PATH/dist/index.js"

    - name: Commit changes
      id: commit
      if: ${{ steps.prepare.outputs.should_run == 'true' && inputs.claude_code_oauth_token != '' && steps.ai.outcome == 'success' && steps.changes.outputs.has_changes == 'true' && steps.pr_metadata.outcome == 'success' }}
      continue-on-error: true
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        COMMIT_MESSAGE: ${{ steps.pr_metadata.outputs.commit_message }}
        ISSUE_CONTEXT_PATH: ${{ steps.prepare.outputs.issue_context_path }}
        RUNNER_RESULT_PATH: ${{ steps.prepare.outputs.runner_result_path }}
      run: |
        git add --all -- . ":(exclude)$ISSUE_CONTEXT_PATH" ":(exclude)$RUNNER_RESULT_PATH"
        git commit -m "$COMMIT_MESSAGE"
        git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        git push --set-upstream origin "${{ steps.prepare.outputs.branch }}"

    - name: Create pull request
      id: pr
      if: ${{ steps.prepare.outputs.should_run == 'true' && inputs.claude_code_oauth_token != '' && steps.ai.outcome == 'success' && steps.changes.outputs.has_changes == 'true' && steps.pr_metadata.outcome == 'success' && steps.commit.outcome == 'success' }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PR_TITLE: ${{ steps.pr_metadata.outputs.pr_title }}
        PR_BODY: ${{ steps.pr_metadata.outputs.pr_body }}
      run: |
        pr_url="$(gh pr create --title "$PR_TITLE" --body "$PR_BODY")"
        printf 'url=%s\n' "$pr_url" >>"$GITHUB_OUTPUT"

    - name: Finalize PR result
      if: ${{ steps.prepare.outputs.should_run == 'true' && inputs.claude_code_oauth_token != '' && steps.ai.outcome == 'success' && steps.changes.outputs.has_changes == 'true' && steps.pr_metadata.outcome == 'success' && steps.commit.outcome == 'success' && steps.pr.outcome == 'success' }}
      shell: bash
      env:
        INPUT_PHASE: finalize_pr
        INPUT_GITHUB_TOKEN: ${{ inputs.dependency_issue_token || inputs.github_token }}
        INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        INPUT_FORCE_AI: ${{ inputs.force_ai }}
        INPUT_CONFIG_PATH: ${{ inputs.config_path }}
        INPUT_AGENT_CONTRACT_PATH: ${{ inputs.agent_contract_path }}
        INPUT_PR_URL: ${{ steps.pr.outputs.url }}
      run: node "$GITHUB_ACTION_PATH/dist/index.js"

    - name: Finalize no-change result
      if: ${{ steps.prepare.outputs.should_run == 'true' && inputs.claude_code_oauth_token != '' && steps.ai.outcome == 'success' && steps.changes.outcome == 'success' && steps.changes.outputs.has_changes == 'false' }}
      shell: bash
      env:
        INPUT_PHASE: finalize_no_changes
        INPUT_GITHUB_TOKEN: ${{ inputs.dependency_issue_token || inputs.github_token }}
        INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        INPUT_FORCE_AI: ${{ inputs.force_ai }}
        INPUT_CONFIG_PATH: ${{ inputs.config_path }}
        INPUT_AGENT_CONTRACT_PATH: ${{ inputs.agent_contract_path }}
      run: node "$GITHUB_ACTION_PATH/dist/index.js"

    - name: Finalize Claude runner failure
      if: ${{ steps.prepare.outputs.should_run == 'true' && inputs.claude_code_oauth_token != '' && steps.ai.outcome != 'success' }}
      shell: bash
      env:
        INPUT_PHASE: finalize_failure
        INPUT_GITHUB_TOKEN: ${{ inputs.dependency_issue_token || inputs.github_token }}
        INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        INPUT_FORCE_AI: ${{ inputs.force_ai }}
        INPUT_CONFIG_PATH: ${{ inputs.config_path }}
        INPUT_AGENT_CONTRACT_PATH: ${{ inputs.agent_contract_path }}
        INPUT_FAILURE_REASON: Claude runner execution failed. Check the workflow logs.
      run: node "$GITHUB_ACTION_PATH/dist/index.js"

    - name: Finalize workflow failure
      if: ${{ steps.prepare.outputs.should_run == 'true' && inputs.claude_code_oauth_token != '' && steps.ai.outcome == 'success' && (steps.changes.outcome != 'success' || (steps.changes.outputs.has_changes == 'true' && (steps.pr_metadata.outcome != 'success' || steps.commit.outcome != 'success' || steps.pr.outcome != 'success'))) }}
      shell: bash
      env:
        INPUT_PHASE: finalize_failure
        INPUT_GITHUB_TOKEN: ${{ inputs.dependency_issue_token || inputs.github_token }}
        INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        INPUT_FORCE_AI: ${{ inputs.force_ai }}
        INPUT_CONFIG_PATH: ${{ inputs.config_path }}
        INPUT_AGENT_CONTRACT_PATH: ${{ inputs.agent_contract_path }}
        INPUT_FAILURE_REASON: Repository change detection, metadata generation, commit, push, or PR creation failed. Check the workflow logs.
      run: node "$GITHUB_ACTION_PATH/dist/index.js"
